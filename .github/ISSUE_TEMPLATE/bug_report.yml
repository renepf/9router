name: Bug Report
description: Report a bug in 9Router or the iOS app
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - 9Router (Web/Proxy)
        - iOS App
        - Cloud Relay
        - SDK
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.4.46
