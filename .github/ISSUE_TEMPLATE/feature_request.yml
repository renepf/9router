name: Feature Request
description: Suggest a new feature
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - 9Router (Web/Proxy)
        - iOS App
        - Cloud Relay
        - SDK
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      placeholder: What do you want to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this needed?
      placeholder: What problem does it solve?
